<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOBINHO - Assistente IA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        header { background: #1e293b; padding: 1rem; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #334155; }
        #chat-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; max-width: 800px; width: 100%; margin: 0 auto; }
        .message { padding: 0.8rem 1rem; border-radius: 1rem; max-width: 75%; line-height: 1.5; word-wrap: break-word; }
        .user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 0.2rem; }
        .bot { background: #334155; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 0.2rem; }
        .input-area { background: #1e293b; padding: 1rem; border-top: 1px solid #334155; display: flex; gap: 0.5rem; max-width: 800px; width: 100%; margin: 0 auto; }
        input { flex: 1; padding: 0.8rem; border-radius: 0.5rem; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { background: #3b82f6; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        .typing { font-style: italic; color: #94a3b8; font-size: 0.9rem; display: none; margin-left: 1rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body>

    <header>🐺 LOBINHO - Assistente Pessoal</header>

    <div id="chat-container">
        <div class="message bot">E aí! Sou o LOBINHO. Como posso te ajudar hoje?</div>
    </div>

    <div id="typing-indicator" class="typing">LOBINHO está digitando...</div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Digite sua mensagem..." autofocus>
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Adiciona mensagem do usuário
            appendMessage(text, 'user');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            typingIndicator.style.display = 'block';

            try {
                // Envia para a API do seu próprio servidor
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                typingIndicator.style.display = 'none';

                if (data.reply) {
                    appendMessage(data.reply, 'bot');
                } else {
                    appendMessage('Opa, deu algum erro aqui na resposta.', 'bot');
                }
            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage('Erro de conexão com o servidor.', 'bot');
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
        }
    </script>
</body>
</html>
